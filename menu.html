<script>
(function(){
    function initialsOf(name){
        var parts=name.replace(/[.\-]/g,' ').split(/\s+/).filter(Boolean);
        var a=parts[0]?parts[0].charAt(0):'';
        var b=parts[1]?parts[1].charAt(0):'';
        return (a+b).toUpperCase();
    }
    function fill(){
        var el=$j('.client-cell-body.aside-right .os-flex-wrapper .element span').first();
        var name=el.length?el.text().trim():'';
        if(name){ $j('#mxMenuDoctor').text(name); $j('#mxMenuInitials').text(initialsOf(name)); }
        var bF=false;
        $j('.js-data-element').each(function(){
            var cap=$j(this).find('.flex-caption').text().trim();
            if(cap.indexOf('Бонус')!==-1){
                var val=$j(this).find('.flex-value').text().trim();
                var num=val.replace(/[^0-9.]/g,'');
                $j('#mxMenuBonus').text(num!==''?num:'0'); bF=true;
            }
        });
        if(!name||!bF){setTimeout(fill,500);}
    }
    $j(document).ready(fill);
})();

(function(){
    var chip=document.getElementById('mxProfileChip');
    var pop=document.getElementById('mxProfilePop');
    if(!chip||!pop) return;
    chip.addEventListener('click',function(e){ e.stopPropagation(); pop.classList.toggle('mxm-open'); });
    document.addEventListener('click',function(e){ if(!pop.contains(e.target)) pop.classList.remove('mxm-open'); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') pop.classList.remove('mxm-open'); });
})();

(function(){
    // активний пункт меню: знімаємо з усіх і ставимо поточному.
    // повторюємо на кожній частковій навігації (mx:navigated), бо меню не перезавантажується.
    function setActive(){
        var path=location.pathname.replace(/\/+$/,'');
        document.querySelectorAll('#mxMenu .mxm-item').forEach(function(a){
            var href=a.getAttribute('href'); var ap='';
            try{ ap=new URL(href,location.origin).pathname.replace(/\/+$/,''); }catch(_){}
            a.classList.toggle('mxm-active', !!(href && href.indexOf('#')===-1 && ap && ap===path));
        });
    }
    setActive();
    window.addEventListener('mx:navigated', setActive);
})();
</script>
