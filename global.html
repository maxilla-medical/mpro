        patients: { hint:'<b>Знайдіть пацієнта</b> за прізвищем', label:'Найновіші дослідження' },
        reports:  { hint:'<b>Знайдіть опис</b> за прізвищем пацієнта', label:'Найновіші описи' },
        ceph:     { hint:'<b>Знайдіть аналіз</b> за прізвищем пацієнта', label:'Найновіші аналізи' },

    function boot(){ if(__gen!==window.__mxGlobalGen) return; tries = tries + 1; if(apply()) return; if(tries > 40) return; setTimeout(boot, 300); }
    boot();

    var OB_TITLES = ['Група Описи Досілджень','Група GuideFlow','Група Пацієнти','Група 3D-Ceph','Група Суперімпозиція','Група Суперпозиція'];
    var htries = 0;
    function hideObTitles(){
        if(__gen!==window.__mxGlobalGen) return;
        htries = htries + 1;
        var col = document.querySelector('.client-cell-body:not(.aside-left):not(.aside-right)');
        if(col){
            var hs = col.querySelectorAll('h1');
            Array.prototype.forEach.call(hs, function(el){ if(OB_TITLES.indexOf(el.textContent.trim()) !== -1){ el.style.display = 'none'; } });
        }
        if(htries > 40) return;
        setTimeout(hideObTitles, 300);
    }
    hideObTitles();

    // ===== оверлей завантаження файлів (псевдо-прогрес) =====
    function showUploadOverlay(hasFiles){
        if(document.getElementById('mxUploadOverlay')) return;
        var ov = document.createElement('div');
        ov.id = 'mxUploadOverlay';
        ov.innerHTML = '<div class="mxul-box">'
            + '<div class="mxul-title">' + (hasFiles ? 'Завантаження файлів…' : 'Надсилання заявки…') + '</div>'
            + '<div class="mxul-bar"><span class="mxul-bar-i"></span></div>'
            + '<div class="mxul-pct">0%</div>'
            + (hasFiles ? '<div class="mxul-sub">Великі файли (КТ) можуть вантажитись до хвилини.<br>Будь ласка, не закривайте сторінку.</div>' : '<div class="mxul-sub">Зачекайте, будь ласка…</div>')
            + '</div>';
        document.body.appendChild(ov);
        var bar = ov.querySelector('.mxul-bar-i');
        var pctEl = ov.querySelector('.mxul-pct');
        requestAnimationFrame(function(){ ov.classList.add('mxul-show'); });
        var pct = 0;
        var cap = hasFiles ? 94 : 88;
        var timer = setInterval(function(){
            var remaining = cap - pct;
            pct += Math.max(0.25, remaining * 0.055);
            if(pct > cap) pct = cap;
            bar.style.width = pct + '%';
            pctEl.textContent = Math.round(pct) + '%';
        }, 200);
        // безпека: не тримати таймер вічно (навігація на success сама прибере оверлей)
        setTimeout(function(){ clearInterval(timer); }, 180000);
    }

    // ===== преміум-стани форм: placeholder, обовʼязкові, помилки =====
    var rtries = 0;
    function markRequired(){
        if(__gen!==window.__mxGlobalGen) return;
        rtries = rtries + 1;
        var col = document.querySelector('.client-cell-body:not(.aside-left):not(.aside-right)');
        if(col){
            var forms = col.querySelectorAll('.os-block-form:not(.params-form)');
            Array.prototype.forEach.call(forms, function(form){
                // компактна шапка: голий інтро-текст після h2 → стилізований підзаголовок
                if(!form.getAttribute('data-mxhead')){
                    form.setAttribute('data-mxhead','1');
                    var h2 = form.querySelector('h2');
                    if(h2){
                        var introTxt = '';
                        var n = h2.nextSibling;
                        var toRemove = [];
                        while(n && !(n.nodeType === 1 && n.tagName === 'FORM')){
                            if(n.nodeType === 3){ introTxt += n.textContent; }
                            if(n.nodeType === 1 && n.tagName === 'BR'){ /* skip */ }
                            var next = n.nextSibling;
                            if(n.nodeType === 3 || (n.nodeType === 1 && n.tagName === 'BR')) toRemove.push(n);
                            n = next;
                        }
                        introTxt = introTxt.replace(/\s+/g,' ').trim();
                        toRemove.forEach(function(node){ if(node.parentNode) node.parentNode.removeChild(node); });
                        if(introTxt){
                            var sub = document.createElement('div');
                            sub.className = 'mx-form-intro';
                            sub.appendChild(document.createTextNode(introTxt + ' '));
                            var pill = document.createElement('span');
                            pill.className = 'mx-form-time';
                            pill.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>~2 хвилини';
                            sub.appendChild(pill);
                            if(h2.nextSibling){ h2.parentNode.insertBefore(sub, h2.nextSibling); }
                            else { h2.parentNode.appendChild(sub); }
                        }
                    }
                }
                var els = form.querySelectorAll('.element');
                Array.prototype.forEach.call(els, function(el){
                    if(el.getAttribute('data-mxel')) return;
                    el.setAttribute('data-mxel','1');
                    // секція-заголовок: маркер heading_filed: в описі
                    var descEl = el.querySelector('.description');
                    var dtxt0 = descEl ? descEl.textContent.trim() : '';
                    if(dtxt0.indexOf('heading_filed:') === 0){
                        el.classList.add('mx-section');
                        var titleEl = el.querySelector('.title');
                        var SECT = { 'Patient':'Пацієнт', 'Planning':'Планування', 'Files':'Файли', 'Doctor':'Лікар', 'Comments':'Коментарі' };
                        var keySec = dtxt0.split(':')[1] ? dtxt0.split(':')[1].trim() : '';
                        if(titleEl && SECT[keySec]){ titleEl.textContent = SECT[keySec]; }
                        return; // це не поле
                    }
                    var field = el.querySelector('input:not([type="hidden"]):not([type="file"]), select, textarea');
                    var desc = el.querySelector('.description');
                    var fileField = el.querySelector('input[type="file"]');
                    // опис → placeholder (звичайні поля) або helper під кнопкою (файлові)
                    if(field && desc){
                        var dtext = desc.textContent.trim();
                        if(dtext && !field.getAttribute('placeholder')){ field.setAttribute('placeholder', dtext); }
                    } else if(fileField && !fileField.getAttribute('data-mxdz')){
                        fileField.setAttribute('data-mxdz','1');
                        fileField.classList.add('mx-filehidden');
                        var dhint = desc ? desc.textContent.trim() : '';
                        if(desc) desc.style.display = 'none';
                        var multiple = fileField.hasAttribute('multiple');
                        var dz = document.createElement('div');
                        dz.className = 'mx-dropzone';
                        dz.innerHTML = '<div class="mx-dz-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M20 16.7A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.2"/></svg></div>'
                            + '<div class="mx-dz-textwrap"><div class="mx-dz-title">Перетягніть файл' + (multiple ? 'и' : '') + ' сюди або <b>оберіть</b></div>'
                            + (dhint ? '<div class="mx-dz-sub">' + dhint + '</div>' : '') + '</div>';
                        var list = document.createElement('div');
                        list.className = 'mx-dz-files';
                        fileField.parentNode.insertBefore(dz, fileField);
                        fileField.parentNode.insertBefore(list, fileField.nextSibling);
                        var render = function(){
                            list.innerHTML = '';
                            var files = fileField.files;
                            if(!files) return;
                            for(var i=0;i<files.length;i++){
                                (function(f){
                                    var row = document.createElement('div');
                                    row.className = 'mx-dz-file';
                                    row.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span class="mx-dz-name">' + f.name + '</span>';
                                    list.appendChild(row);
                                })(files[i]);
                            }
                            if(files.length){
                                dz.querySelector('.mx-dz-title').innerHTML = 'Файл' + (files.length>1?'и':'') + ' додано — <b>змінити</b>';
                            } else {
                                dz.querySelector('.mx-dz-title').innerHTML = 'Перетягніть файл' + (multiple?'и':'') + ' сюди або <b>оберіть</b>';
                            }
                        };
                        dz.addEventListener('click', function(){ fileField.click(); });
                        ['dragover','dragenter'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('mx-drag'); }); });
                        ['dragleave','dragend'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove('mx-drag'); }); });
                        dz.addEventListener('drop', function(e){
                            e.preventDefault(); dz.classList.remove('mx-drag');
                            if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
                                try { fileField.files = e.dataTransfer.files; } catch(err){}
                                render();
                            }
                        });
                        fileField.addEventListener('change', render);
                    }
                    // Enter → наступне поле (окрім textarea)
                    if(field && field.tagName !== 'TEXTAREA' && field.tagName !== 'SELECT'){
                        field.addEventListener('keydown', function(e){
                            if(e.key !== 'Enter') return;
                            e.preventDefault();
                            var all = Array.prototype.slice.call(form.querySelectorAll('input:not([type="hidden"]):not([type="submit"]), select, textarea'));
                            var idx = all.indexOf(e.target);
                            if(idx > -1 && idx < all.length - 1){ all[idx + 1].focus(); }
                            else {
                                var sb = form.querySelector('input[type="submit"], button[type="submit"], .js-check-required');
                                if(sb) sb.focus();
                            }
                        });
                    }
                    var isReq = el.querySelector('.js-required, input[required], select[required], textarea[required]');
                    if(isReq){
                        var title = el.querySelector('.title');
                        if(title && !title.querySelector('.mx-req')){
                            var st = document.createElement('span');
                            st.className = 'mx-req'; st.textContent = '*';
                            title.appendChild(st);
                        }
                        if(field){
                            field.addEventListener('blur', function(){
                                if(!field.value || !field.value.trim()){ el.classList.add('mx-el-invalid'); }
                                else { el.classList.remove('mx-el-invalid'); }
                            });
                            field.addEventListener('input', function(){
                                if(field.value && field.value.trim()){ el.classList.remove('mx-el-invalid'); }
                            });
                        }
                    }
                });
                var submit = form.querySelector('input[type="submit"], button[type="submit"], .js-check-required');
                if(submit && !submit.getAttribute('data-mxsub')){
                    submit.setAttribute('data-mxsub','1');
                    submit.addEventListener('click', function(){
                        Array.prototype.forEach.call(form.querySelectorAll('.element'), function(el){
                            var f = el.querySelector('.js-required, input[required], select[required], textarea[required]');
                            if(f && (!f.value || !f.value.trim())){ el.classList.add('mx-el-invalid'); }
                        });
                    }, true);
                }
                // оверлей завантаження при валідній відправці
                var realForm = form.querySelector('form.js-form-validate') || form.querySelector('form');
                if(realForm && !realForm.getAttribute('data-mxul')){
                    realForm.setAttribute('data-mxul','1');
                    realForm.addEventListener('submit', function(){
                        var hasEmpty = false;
                        Array.prototype.forEach.call(realForm.querySelectorAll('.js-required, input[required], select[required], textarea[required]'), function(f){
                            if(!f.value || !f.value.trim()){ hasEmpty = true; }
                        });
                        if(hasEmpty) return; // OneBox заблокує сабміт — оверлей не потрібен
                        var hasFiles = false;
                        Array.prototype.forEach.call(realForm.querySelectorAll('input[type="file"]'), function(fi){ if(fi.files && fi.files.length){ hasFiles = true; } });
                        showUploadOverlay(hasFiles);
                    });
                }
            });
        }
        if(rtries > 40) return;
        setTimeout(markRequired, 300);
    }
    markRequired();
  }
  if(document.readyState !== 'loading') mxGlobalInit();
  else document.addEventListener('DOMContentLoaded', mxGlobalInit);
  window.addEventListener('mx:navigated', mxGlobalInit);
})();
</script>
