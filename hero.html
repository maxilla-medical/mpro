            var dots = '';
            for(var di=1; di<=STEP_LBL_F.length; di++){ dots += '<span class="mx-fd' + (di===1?' mx-on':'') + '"></span>'; }
            // заголовок/підзаголовок тягнемо з налаштувань форми OneBox:
            // «Название формы» → прихований <h2> у картці; «Описание» → текстовий блок картки до <form>.
            // Якщо в налаштуваннях порожньо — фолбек на стандартні тексти.
            var fName = '', fDesc = '';
            var fH2 = card.querySelector('h2');
            if(fH2){ fName = (fH2.textContent || '').replace(/\s+/g, ' ').trim(); }
            Array.prototype.forEach.call(card.children, function(c){
                if(fDesc || !c.tagName) return;
                var tg = c.tagName.toLowerCase();
                if(tg === 'h2' || tg === 'form' || tg === 'style' || tg === 'script') return;
                if((c.textContent || '').replace(/\s+/g, ' ').trim()){ fDesc = c.innerHTML; }
            });
            var headHTML =
                '<div class="mx-form-head">' +
                '<div class="mx-fill"><span class="mx-fill-badge">Крок 1 з ' + STEP_LBL_F.length + '</span>' +
                '<span class="mx-fill-dots">' + dots + '</span>' +
                '<span class="mx-fill-name">' + STEP_LBL_F[0] + '</span></div>' +
                '<div class="mx-fh-h1">' + (fName || 'Хірургічний шаблон') + '</div>' +
                '<div class="mx-fh-sub">' + (fDesc || 'Сплануємо та виготовимо під вашого пацієнта · заповнення <b>~2 хвилини</b>') + '</div></div>';

            var grid = document.createElement('div'); grid.id = 'mxProcGrid';
            var lcol = document.createElement('div'); lcol.className = 'mx-col-form';
            var rcol = document.createElement('div'); rcol.className = 'mx-col-side';
            // той самий таймлайн, що на кроці 2 — обидва кроки виглядають як один продукт
            rcol.innerHTML =
                '<div class="mx-side">' +
                    '<div class="mx-side-eyebrow">Як це працює</div>' +
                    '<div class="mx-stp mx-stp-act"><div class="mx-stp-rail"><span class="mx-stp-n">1</span><span class="mx-stp-line"></span></div>' +
                        '<div class="mx-stp-txt"><div class="mx-stp-t">Спочатку — оцінка<span class="mx-stp-here">Ви тут</span></div>' +
                        '<div class="mx-stp-s">Заповнюєте заявку, надсилаєте КТ — ми аналізуємо випадок і готуємо пропозицію. <b>Безкоштовно.</b></div></div></div>' +
                    '<div class="mx-stp"><div class="mx-stp-rail"><span class="mx-stp-n">2</span><span class="mx-stp-line"></span></div>' +
                        '<div class="mx-stp-txt"><div class="mx-stp-t">Оплата після погодження</div>' +
                        '<div class="mx-stp-s">Вносите оплату лише тоді, коли запропонований план Вас влаштовує.</div></div></div>' +
                    '<div class="mx-stp"><div class="mx-stp-rail"><span class="mx-stp-n">3</span></div>' +
                        '<div class="mx-stp-txt"><div class="mx-stp-t">Шаблон у клініці за 48 годин</div>' +
                        '<div class="mx-stp-s">Виготовляємо та надсилаємо Новою Поштою одразу після погодження планування.</div></div></div>' +
                    '<div class="mx-side-foot">' + fICheck + 'Дані пацієнта захищені</div>' +
                '</div>';
            grid.appendChild(lcol); grid.appendChild(rcol);
            top.parentNode.insertBefore(grid, top.nextSibling);
            lcol.insertAdjacentHTML('afterbegin', headHTML);
            lcol.appendChild(card);              // переносимо картку форми ліворуч
            // назва/опис можуть дорендерюватись ПІЗНІШЕ за наш перший рід — доганяємо кілька секунд
            (function(){
                var h1El = lcol.querySelector('.mx-fh-h1'), subEl = lcol.querySelector('.mx-fh-sub');
                var tries = 0;
                var t = setInterval(function(){
                    tries++;
                    var hh = card.querySelector('h2');
                    var nm = hh ? (hh.textContent || '').replace(/\s+/g, ' ').trim() : '';
                    if(nm && h1El && h1El.textContent !== nm){ h1El.textContent = nm; }
                    var d = card.querySelector('.mx-form-intro, .description-form, .form-description, .os-form-description');
                    if(!d){
                        Array.prototype.forEach.call(card.children, function(c){
                            if(d || !c.tagName) return;
                            var tg = c.tagName.toLowerCase();
                            if(tg === 'h2' || tg === 'form' || tg === 'style' || tg === 'script') return;
                            if((c.textContent || '').replace(/\s+/g, ' ').trim()){ d = c; }
                        });
                    }
                    if(d && subEl){
                        var html = (d.innerHTML || '').trim();
                        if(html && subEl.innerHTML !== html){ subEl.innerHTML = html; }
                        clearInterval(t);
                    } else if(tries > 25){ clearInterval(t); }   // ~5с, далі лишаємо фолбек
                }, 200);
            })();

            // нумерація реальних полів (пропускаємо секції-заголовки heading_filed)
            var num = 0;
            Array.prototype.forEach.call(card.querySelectorAll('.element'), function(el){
                if(el.classList.contains('mx-section')) return;
                var d = el.querySelector('.description');
                if(d && d.textContent.trim().indexOf('heading_filed:') === 0) return;
                var fld = el.querySelector('input:not([type="hidden"]):not([type="submit"]), select, textarea');
                var title = el.querySelector('.title');
                if(!fld || !title || title.querySelector('.mx-fnum')) return;
                num = num + 1;
                var badge = document.createElement('span'); badge.className = 'mx-fnum'; badge.textContent = num;
                title.insertBefore(badge, title.firstChild);
                // статус поля — пилюлі, як на кроці 2 (зірочку прибираємо)
                // обовʼязковість у OneBox позначає клас js-required на інпуті (зірочка може домальовуватись пізніше)
                var isReq = !!el.querySelector('.js-required, [required], .required-message') || /\*/.test(title.textContent);
                Array.prototype.forEach.call(title.childNodes, function(n){
                    if(n.nodeType === 3 && n.textContent.indexOf('*') !== -1){ n.textContent = n.textContent.replace(/\s*\*\s*/g, ' ').replace(/\s+$/,''); }
                });
                var star = title.querySelector('.req, sup'); if(star && star.parentNode){ star.parentNode.removeChild(star); }
                var pill = document.createElement('span');
                if(isReq){ pill.className = 'mx-req-badge mx-req-star'; pill.textContent = 'Обов’язково'; }
                else { pill.className = 'mx-req-badge mx-req-opt'; pill.textContent = 'Опційно'; }
                title.appendChild(pill);
                // плейсхолдер-спонука: «Вкажіть…» — мікро-заклик до дії замість пасивного дубля назви
                if(fld && (fld.tagName === 'INPUT' || fld.tagName === 'TEXTAREA')){
                    var lbl = '';
                    Array.prototype.forEach.call(title.childNodes, function(n){ if(n.nodeType === 3) lbl += n.textContent; });
                    lbl = lbl.replace(/\s+/g, ' ').trim();
                    var low = lbl.toLowerCase(), ph = null;
                    if(low.indexOf('пацієнт') !== -1) ph = 'Вкажіть повне ім’я пацієнта';
                    else if(low.indexOf('систем') !== -1) ph = 'Вкажіть систему імплантатів';
                    else if(low.indexOf('позиці') !== -1) ph = 'Вкажіть бажані позиції — напр., 14, 16, 24';
                    else if(low.indexOf('комент') !== -1) ph = 'Додайте побажання до плану — за бажанням';
                    else if(lbl) ph = 'Вкажіть: ' + lbl.charAt(0).toLowerCase() + lbl.slice(1);
                    if(ph) fld.setAttribute('placeholder', ph);
                }
            });

            // «Далі →» окремою пілюлею ПІД карткою (як у F1). Справжній сабміт лишаємо у формі
            // (щоб відправка працювала), ховаємо його і клікаємо через проксі-кнопку.
            var sb = card.querySelector('input[type="submit"], button[type="submit"]');
            if(sb && !document.getElementById('mxNextProxy')){
                sb.classList.add('mx-realsubmit');
                var proxy = document.createElement('a');
                proxy.id = 'mxNextProxy'; proxy.className = 'mx-next-proxy'; proxy.href = 'javascript:void(0)';
                proxy.innerHTML = 'Далі <span style="margin-left:calc(4 * var(--u))">\u2192</span>';
                // м'яка валідація: червоним стають лише незаповнені обовʼязкові поля ПІСЛЯ спроби переходу
                proxy.addEventListener('click', function(e){
                    e.preventDefault();
                    var missing = [];
                    Array.prototype.forEach.call(card.querySelectorAll('.element'), function(el2){
                        var inp = el2.querySelector('input.js-required, textarea.js-required, select.js-required');
                        if(!inp || !inp.offsetParent) return;
                        if(!(inp.value || '').trim()){ el2.classList.remove('mx-req-miss'); void el2.offsetWidth; el2.classList.add('mx-req-miss'); missing.push(el2); }
                    });
                    if(missing.length){
                        try{ missing[0].scrollIntoView({ behavior:'smooth', block:'center' }); }catch(_){ }
                        var fi2 = missing[0].querySelector('input, textarea'); if(fi2){ try{ fi2.focus({ preventScroll:true }); }catch(_){ } }
                        return;
                    }
                    sb.click();
                });
                // заповнив поле → червоний стан гасне одразу
                card.addEventListener('input', function(ev){
                    var el2 = (ev.target && ev.target.closest) ? ev.target.closest('.element') : null;
                    if(el2 && el2.classList.contains('mx-req-miss') && (ev.target.value || '').trim()){ el2.classList.remove('mx-req-miss'); }
                }, true);
                lcol.appendChild(proxy);
            }

            // вирівнюємо панель (верх по картці, низи зводить flex)
            var alignFormSide = function(){
                var sideEl = rcol.querySelector('.mx-side');
                if(!sideEl) return;
                sideEl.style.minHeight = ''; rcol.style.marginTop = '';
                if(window.innerWidth <= 900){ rcol.style.removeProperty('--mx-head-h'); return; }
                var off = card.getBoundingClientRect().top - lcol.getBoundingClientRect().top;
                rcol.style.setProperty('--mx-head-h', (off > 0 ? off : 0) + 'px');
            };
            requestAnimationFrame(function(){ requestAnimationFrame(alignFormSide); });
            setTimeout(alignFormSide, 200); setTimeout(alignFormSide, 600); setTimeout(alignFormSide, 1200); setTimeout(alignFormSide, 2500);
            window.__mxAlignFn = alignFormSide;
            if(!window.__mxAlignBound){ window.__mxAlignBound = true; window.addEventListener('resize', function(){ if(window.__mxAlignFn) window.__mxAlignFn(); }); }
            if(window.ResizeObserver){ if(window.__mxRO){ try{ window.__mxRO.disconnect(); }catch(_){ } } window.__mxRO = new ResizeObserver(function(){ if(window.__mxAlignFn) window.__mxAlignFn(); }); window.__mxRO.observe(lcol); }
        }
        renderForm();
    } else if(key === 'home'){
        var hh = new Date().getHours();
        var g = 'Добрий день';
        if(hh >= 5 && hh <= 11) g = 'Доброго ранку';
        if(hh >= 18 || hh <= 4) g = 'Добрий вечір';
        if(titleEl) titleEl.textContent = g;
        if(dateEl) dateEl.textContent = new Date().toLocaleDateString('uk-UA', { weekday:'long', day:'numeric', month:'long' });
        if(subEl) subEl.style.display = 'none';
    } else {
        var cfg = HERO[key];
        if(cfg){
            if(titleEl) titleEl.textContent = cfg.title;
            if(dateEl){ dateEl.textContent = ''; dateEl.style.display = 'none'; }
            if(subEl){ subEl.textContent = cfg.sub; subEl.style.display = 'block'; }
        }
    }
    // page-aware CTA (закриває PENDING #2)
    var ctaCfg = CTA[key] || CTA_DEFAULT;
    var ctaEl = document.getElementById('mxHeroCta');
    if(ctaEl){
        ctaEl.setAttribute('href', ctaCfg.href);
        var ctaTxt = document.getElementById('mxHeroCtaText');
        if(ctaTxt) ctaTxt.textContent = ctaCfg.text;
        var ctaIco = document.getElementById('mxHeroCtaIco');
        // иконку меняем только если она отличается от дефолтной (нет мигания на прочих страницах)
        if(ctaIco && ctaCfg.icon && ctaCfg.icon !== 'user-plus'){
            var ni = document.createElement('i');
            ni.id = 'mxHeroCtaIco';
            ni.setAttribute('data-lucide', ctaCfg.icon);
            ni.style.width = 'calc(15 * var(--u))';
            ni.style.height = 'calc(15 * var(--u))';
            ctaIco.parentNode.replaceChild(ni, ctaIco);
        }
    }
    if(window.lucide) lucide.createIcons();
    var inpRef = null, btnRef = null;
    function placeBtn(){
        if(!inpRef || !btnRef) return;
        var cs = getComputedStyle(inpRef);
        var bT = parseFloat(cs.borderTopWidth) || 0;
        var bR = parseFloat(cs.borderRightWidth) || 0;
        var bB = parseFloat(cs.borderBottomWidth) || 0;
        var it = inpRef.offsetTop, il = inpRef.offsetLeft;
        var ih = inpRef.offsetHeight, iw = inpRef.offsetWidth;
        btnRef.style.top = (it + bT) + 'px';
        btnRef.style.height = (ih - bT - bB) + 'px';
        btnRef.style.left = (il + iw - bR - btnRef.offsetWidth) + 'px';
    }
    var tries = 0;
    function tune(){
        tries = tries + 1;
        if(tries > 40) return;
        var col = document.querySelector('.client-cell-body:not(.aside-left):not(.aside-right)');
        var inp = col ? col.querySelector('input[name="filtername"]') : null;
        if(!inp){ setTimeout(tune, 300); return; }
        var wrap = inp.parentElement;
        inpRef = inp;
        var links = col.getElementsByTagName('a');
        Array.prototype.forEach.call(links, function(a){
            var x = a.textContent.trim();
            if(x === 'Фильтровать' || x === 'Фільтрувати'){ a.style.display = 'none'; }
        });
        var btn = col.querySelector('.params-form input.os-button, .params-form input[type="submit"]');
        if(btn){
            btnRef = btn;
            if(!btn.classList.contains('mx-search-btn')){
                btn.value = 'Шукати';
                btn.classList.add('mx-search-btn');
                if(wrap && btn.parentElement !== wrap){ wrap.appendChild(btn); }
            }
        }
        if(wrap && !wrap.querySelector('.mx-search-ico')){
            var ico = document.createElement('i');
            ico.setAttribute('data-lucide','search');
            ico.className = 'mx-search-ico';
            wrap.appendChild(ico);
            if(window.lucide) lucide.createIcons();
        }
        placeBtn();
        if(!btn){ setTimeout(tune, 300); }
    }
    tune();
    window.addEventListener('resize', function(){ setTimeout(placeBtn, 60); });
    setTimeout(placeBtn, 700);
    setTimeout(placeBtn, 1500);
})();
</script>
