#mxProcGrid{ display:flex; align-items:stretch; justify-content:center; gap:calc(28 * var(--u)); max-width:calc(1000 * var(--u)); margin:0 auto; width:100%; box-sizing:border-box; }
/* однакова ширина блоків на кроках 1 і 2: картка заповнює свою колонку на обох сторінках
   (без цього грід на сторінці форми стискався, і блоки виглядали меншими, ніж на кроці 2) */

/* ===== крок 1 = крок 2: однакова геометрія картки, підписів і полів (звірено замірами) ===== */

#mxProcGrid .os-block-form .element input[type="number"],

/* гейт «Надіслати без КТ»: червона зона + повідомлення + легкий струс */

        // 6 кроків клієнтського шляху — єдина модель прогресу на екрані
        var STAGES = ['Оцінка','Оплата','Планування','Погодження','Виготовлення','Відправлено'];

            'Очікує нові дані':{c:'Потрібні дані',s:1},

        var STATUS_MAP_PRINT = {

            'Перевірка даних':{c:'Перевірка файлу',s:1},

            'Пропозиція':{c:'Вартість готова',s:2},
            'Рахунок висталено':{c:'Очікує оплати',s:2},

        };
        // назва бізнес-процесу з бічного блоку — визначає сценарій екрана

            return status;
        }
        function buildFillStepper(active){
            var N = STEP_LBL.length;

                var cls = i < active ? 'mx-done' : (i === active ? 'mx-active' : '');
                var inner = i < active ? CHECK : String(i);
                h += '<div class="mx-step ' + cls + '"><div class="mx-step-dot">' + inner + '</div><div class="mx-step-lbl">' + STEP_LBL[i-1] + '</div></div>';
                if(i < N){ h += '<div class="mx-step-line ' + (i < active ? 'mx-done' : '') + '"></div>'; }
            }
            return h + '</div>';
        }
        function buildTracker(stage, clientText, hideStatus){
            var h = '<div class="mx-track"><div class="mx-track-row">';
            for(var i=1;i<=5;i++){
                var cls = i < stage ? 'mx-done' : (i === stage ? 'mx-active' : '');
                var inner = i < stage ? CHECK : String(i);
                h += '<div class="mx-tstage ' + cls + '"><div class="mx-tdot">' + inner + '</div><div class="mx-tlbl">' + STAGES[i-1] + '</div></div>';
                if(i < 5){ h += '<div class="mx-tline ' + (i < stage ? 'mx-done' : '') + '"></div>'; }
            }
            if(!hideStatus && clientText){
                h += '<div class="mx-track-status"><div class="mx-ts-badge">' + clientText + '</div></div>';
            }
            h += '</div></div>';
            return h;
        }
        // ===== ЕТАЛОН ЕКРАНА ЕТАПУ (трекер-статуси): грід + квитанція + жива панель «Ви тут» =====
        function mxTrackLayout(col, m, status){
            if(document.getElementById('mxProcGrid')) return;
            function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
            var tCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
            var tIco   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>';
            var tChat  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 20l1-5.7a8.5 8.5 0 1 1 17-2.8z"/></svg>';
            // --- грід + панель (фаза: етапи 1-2 → оцінка, 3 → оплата, 4-5 → шаблон) ---
            var ordNumEarly = (location.pathname.match(/\/client\/order\/(\d+)/) || [])[1] || '';
            var isPrintP = /друк/i.test(mxBpName());              // сценарій 3D-друку
            var ST_LIST = isPrintP ? STAGES_PRINT : STAGES;        // підписи етапів свого процесу
            var grid = document.createElement('div'); grid.id = 'mxProcGrid'; grid.className = 'mx-grid-track';
            var lcol = document.createElement('div'); lcol.className = 'mx-col-form';
            var rcol = document.createElement('div'); rcol.className = 'mx-col-side';
            // текст під бейджем дублює нижню нотатку «чий хід» — прибираємо дубль
            var topNote = document.querySelector('#mxProcTop .mx-ts-note');
            if(topNote){ topNote.style.display = 'none'; }
            // після оплати «Ви тут» переїжджає на крок 3 (виготовлення), а не лишається на оплаті
            var isPaid = m.s >= 3;                                        // оплата позаду
            var isWaitData = /очікує додаткові дані/i.test(status);       // пауза після оплати
            var isPlanning = /оплачено|депозит|створення проекту|без передоплати/i.test(status);
            var isApprove  = /погодження проекту/i.test(status);          // потрібне рішення клієнта
            var isFixing   = /необхідні правки/i.test(status);            // ми вносимо правки
            // ПАНЕЛЬ. До оплати — «Як це працює» (продає модель роботи).
            // Після оплати — службова довідка: прогрес живе ЛИШЕ у верхньому барі, «Ви тут» не дублюємо.
            if(isPaid){
                var icoTgSide = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.9 19c-.2 1-.8 1.2-1.6.8l-4.5-3.3-2.2 2.1c-.2.2-.5.5-.9.5l.3-4.6 8.3-7.5c.4-.3-.1-.5-.6-.2L7.4 13 3 11.6c-1-.3-1-1 .2-1.5l17.3-6.7c.8-.3 1.5.2 1.4 1z"/></svg>';
                var sideMsg = 'Добрий день! Маю питання щодо замовлення' + (ordNumEarly ? ' №' + ordNumEarly : '');

                    + '<div class="mx-side-foot">' + tCheck + 'Дані пацієнта захищені</div></div>';
            } else {

                ] : [

                var sh = '';
                PH.forEach(function(p, i){
                    var done = (i + 1) < phase, act = (i + 1) === phase, last = (i === PH.length - 1);
                    sh += '<div class="mx-stp' + (act ? ' mx-stp-act' : '') + (done ? ' mx-stp-done' : '') + '">'
                        + '<div class="mx-stp-rail"><span class="mx-stp-n">' + (done ? tCheck : (i + 1)) + '</span>' + (last ? '' : '<span class="mx-stp-line"></span>') + '</div>'

                        } else if(sgBad){
                            sgBad.classList.remove('mx-req-miss'); void sgBad.offsetWidth; sgBad.classList.add('mx-req-miss');
                            missing.unshift(sgBad); failKind = 'seg';
                        } else if(mxStudy.rotMissing()){
                            var e2 = mxStudy.rotEl;
                            e2.classList.remove('mx-req-miss'); void e2.offsetWidth; e2.classList.add('mx-req-miss');
                            missing.unshift(e2); failKind = 'rot';
                        }
                    }
                    try{ window.__mxGate = { kind: failKind, n: missing.length }; }catch(_){ }   // для діагностики на живій сторінці
                    if(missing.length){
                        if(mxStudy && mxStudy.onFail) mxStudy.onFail(failKind);
                        if(mxStudy && mxStudy.reveal) mxStudy.reveal(missing[0]);
                        try{ missing[0].scrollIntoView({ behavior:'smooth', block:'center' }); }catch(_){ }
                        var fi2 = missing[0].querySelector('input, textarea'); if(fi2){ try{ fi2.focus({ preventScroll:true }); }catch(_){ } }
                        return;
                    }
                    if(mxStudy && mxStudy.clearFail) mxStudy.clearFail();
                    if(mxStudy && mxStudy.onSubmit) mxStudy.onSubmit();
                    sb.click();
                });
                // заповнив поле → червоний стан гасне одразу
                card.addEventListener('input', function(ev){
                    var el2 = (ev.target && ev.target.closest) ? ev.target.closest('.element') : null;
                    if(el2 && el2.classList.contains('mx-req-miss') && (ev.target.value || '').trim()){ el2.classList.remove('mx-req-miss'); }
                }, true);
                lcol.appendChild(proxy);
            }

            // ================= ФОРМА ЗАПИСУ: класика — 9 блоків-карток (мова форми 6) =================
            // Жодних згорнутих секцій і зайвих шарів: пацієнт → найчастіше → категорії → опис →
            // коментар. Усе видно одразу, ніщо не рухається саме. «Найчастіше» — НЕ копії:
            // картка керує тим самим <option>, що й чип у категорії, вибір світиться в обох місцях.
            if(mxStudy){
                grid.classList.add('mx-form-study');
                var T = mxStudy.ttlText;
                function nrm(x){ return String(x || '').toLowerCase().replace(/["'’ʼ`]/g, '').replace(/\s+/g, ' ').trim(); }
                function esc2(x){ return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

                var formEl = card.querySelector('form') || card;
                var rows = Array.prototype.filter.call(formEl.children, function(n){ return n.classList && n.classList.contains('element'); });

                // ---- 1. розпізнаємо поля (єдиний дозволений матч — текст заголовка через ttlText)
                var elName = null, elPhone = null, elTime = null, elComment = null;
                var mJaw = null, mHead = null, mJoint = null, mPano = null, mExtra = null, mBundle = null;
                mxStudy.multis.forEach(function(m){
                    var t = nrm(m.name);
                    if(!mBundle && t.indexOf('комплект') !== -1){ mBundle = m; return; }
                    if(!mExtra && t.indexOf('додатков') !== -1){ mExtra = m; return; }
                    if(!mJoint && t.indexOf('суглоб') !== -1){ mJoint = m; return; }
                    if(!mPano && (t.indexOf('панорам') !== -1 || t.indexOf('трг') !== -1)){ mPano = m; return; }
                    if(!mHead && (t.indexOf('голов') !== -1 || t.indexOf('череп') !== -1)){ mHead = m; return; }
                    if(!mJaw && t.indexOf('щелеп') !== -1){ mJaw = m; return; }
                });
                rows.forEach(function(el){
                    if(el.querySelector('select[multiple]')) return;
                    var t = nrm(T(el));
                    if(!elPhone && t.indexOf('телефон') !== -1 && el.querySelector('input')){ elPhone = el; return; }
                    if(!elTime && (t.indexOf('час візиту') !== -1 || t.indexOf('бажаний час') !== -1)){ elTime = el; return; }
                    if(el.classList.contains('mx-seg') || el.classList.contains('mx-field-off') || el.classList.contains('mx-dep')) return;
                    // «Комментар» (рос., поки George не перейменував) і «Коментар» — обидва варіанти
                    if(!elComment && /комм?ент/.test(t) && el.querySelector('textarea, input[type="text"]')){ elComment = el; return; }
                    if(!elName && (t.indexOf('п.і.б') !== -1 || t.indexOf('піб') !== -1 || t.indexOf('імя') !== -1 || t.indexOf('пацієнт') !== -1) && el.querySelector('input[type="text"], input[type="tel"]')){ elName = el; return; }
                });
                if(mBundle){ mBundle.off = true; mBundle.el.classList.add('mx-field-off'); }
                if(elTime){ elTime.classList.add('mx-field-off'); }

                // ---- 2. дев'ять карток у порядку ТЗ; справжній сабміт лишається у формі — картки перед ним
                function mkCard(title, cls){
                    var c9 = document.createElement('div'); c9.className = 'mx-c9' + (cls ? ' ' + cls : '');
                    c9.innerHTML = '<div class="mx-c9-h">' + title + '</div><div class="mx-c9-b"></div>';
                    if(sb && sb.parentNode === formEl){ formEl.insertBefore(c9, sb); } else { formEl.appendChild(c9); }
                    return c9;
                }
                function put(c9, els){
                    if(!c9) return;
                    var b = c9.querySelector('.mx-c9-b');
                    (els || []).forEach(function(e){ if(e) b.appendChild(e); });
                }
                // підзаголовок картки (тихий конверсійний рядок) і плашка 2D/3D у заголовку
                function subLine(c9, text){
                    if(!c9) return;
                    c9.querySelector('.mx-c9-h').insertAdjacentHTML('afterend', '<div class="mx-c9-sub">' + text + '</div>');
                }
                function hBadge(c9, text, cls){
                    if(!c9) return;
                    c9.querySelector('.mx-c9-h').insertAdjacentHTML('beforeend', '<span class="mx-c9-badge ' + cls + '">' + text + '</span>');
                }
                var SUB_3D = 'Максимум деталей: КТ дає до 100% діагностичної інформації.';
                // власний підпис поля замість назви з OneBox (текстові вузли міняємо, бейджі лишаються)
                function retitle(el, txt){
                    if(!el) return;
                    var t = el.querySelector('.title'); if(!t) return;
                    var done = false;
                    Array.prototype.slice.call(t.childNodes).forEach(function(n){
                        if(n.nodeType !== 3) return;
                        if(!done && n.textContent.trim()){ n.textContent = txt + ' '; done = true; }
                        else if(n.textContent.trim()){ n.textContent = ' '; }
                    });
                }
                var cPat = mkCard('Дані пацієнта', 'mx-c9-pat'); put(cPat, [elName, elPhone]);
                subLine(cPat, 'Вкажіть, будь ласка, контакти пацієнта — усе інше ми візьмемо на себе.');
                retitle(elName, 'Повне імʼя');
                retitle(elPhone, 'Телефон');
                // «Найчастіше призначають» — акцентна картка швидкого вибору: значок,
                // тонований фон і тихий підзаголовок, що пояснює суть без крику
                var cFav = mkCard('Найчастіше призначають', 'mx-c9-fav');
                cFav.querySelector('.mx-c9-h').insertAdjacentHTML('afterbegin',
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>');
                subLine(cFav, 'Пʼять досліджень, з яких складається більшість направлень — оберіть одним кліком.');
                var cHead = mHead ? mkCard('КТ Голови') : null; put(cHead, mHead ? [mHead.el] : []);
                hBadge(cHead, '3D Знімки', 'mx-b3'); subLine(cHead, SUB_3D);
                var cJaw = mJaw ? mkCard('КТ Щелеп') : null; put(cJaw, mJaw ? [mJaw.el] : []);
                hBadge(cJaw, '3D Знімки', 'mx-b3'); subLine(cJaw, SUB_3D);
                var segRows = (mxStudy.segEls || []).map(function(sg){ return sg.el; });
                var cSeg = segRows.length ? mkCard('КТ Сегментів') : null; put(cSeg, segRows);
                hBadge(cSeg, '3D Знімки', 'mx-b3'); subLine(cSeg, SUB_3D);
                var cJoint = mJoint ? mkCard('КТ Суглобів') : null; put(cJoint, mJoint ? [mJoint.el] : []);
                hBadge(cJoint, '3D Знімки', 'mx-b3'); subLine(cJoint, SUB_3D);
                var cPano = mPano ? mkCard('Звичайні знімки') : null; put(cPano, mPano ? [mPano.el] : []);
                hBadge(cPano, '2D Знімки', 'mx-b2');
                subLine(cPano, '2D-знімок передає до 25% інформації від того що можна побачити на КТ');
                var cExtra = mExtra ? mkCard('Опис знімків') : null; put(cExtra, mExtra ? [mExtra.el] : []);
                subLine(cExtra, 'Опис готуємо до трьох робочих днів — найчастіше він готовий значно раніше.');
                var cCmt = elComment ? mkCard('Коментар', 'mx-c9-cmt') : null; put(cCmt, elComment ? [elComment] : []);
                subLine(cCmt, 'Якщо є щось важливе для дослідження — напишіть, ми обовʼязково врахуємо.');

                // ---- 3. рядки всередині карток — точно за ТЗ (одна позиція в рядку = на всю ширину)
                function layoutRows(m, spec){
                    if(!m || !m.chips) return;
                    var used = [];
                    spec.forEach(function(rowDef){
                        var full = rowDef.length === 1;
                        rowDef.forEach(function(re){
                            var hit = null;
                            m.opts.forEach(function(x){ if(!hit && used.indexOf(x) === -1 && re.test(x.t)) hit = x; });
                            if(!hit) return;
                            used.push(hit);
                            if(full){ hit.cell.classList.add('mx-cell-full'); }
                            m.chips.appendChild(hit.cell);
                        });
                    });
                }
                layoutRows(mPano, [[/панорамн/], [/трг (бокова|бічна)/, /трг пряма/]]);
                layoutRows(mHead, [[/череп/, /пазух/]]);
                // «двох щелеп» і «двох щелеп з суглобами» — поруч у першому рядку, обидва з поясненням
                layoutRows(mJaw, [[/^кт двох щелеп$/, /щелеп з суглобами/], [/верхн/, /нижн/]]);
                layoutRows(mJoint, [[/двох суглобів/], [/лівого/], [/правого/]]);

                // ---- 3b. пояснення під назвою дослідження: що саме входить у знімок.
                // Стилі кладемо тут-таки, щоб уся ця правка жила одним блоком коду.
                var DESC_JAW  = 'Включає дві щелепи, бухти гайморових пазух та гілки нижньої щелепи без суглобів';
                var DESC_JAWJ = 'Включає дві щелепи, бухти гайморових пазух, гілки нижньої щелепи та суглоби';
                var DESC_CEPH = 'Включає 3D-цефалометричний аналіз з розрахунками за 10+ авторами';
                var NOTE_JAWJ = 'Якщо потрібні ще й суглоби';
                (function(){
                    if(document.getElementById('mxC9Desc')) return;
                    var st = document.createElement('style'); st.id = 'mxC9Desc';
                    st.textContent = ''
                        /* картки одного рядка тягнуться на висоту найвищої */
                        + '#mxProcGrid.mx-form-study .mx-c9 .mx-cell > .mx-chip{ flex:1 1 auto; }'
                        /* чип із поясненням: назва + тихий другий рядок */
                        + '#mxProcGrid.mx-form-study .mx-c9 .mx-chip.mx-chip-desc{ padding-top:calc(13 * var(--u)); padding-bottom:calc(13 * var(--u)); }'
                        + '#mxProcGrid.mx-form-study .mx-c9 .mx-chip .mx-pc-tx{ display:flex; flex-direction:column; gap:calc(4 * var(--u)); min-width:0; flex:1 1 auto; }'
                        + '#mxProcGrid.mx-form-study .mx-c9 .mx-chip .mx-pc-t{ font-weight:600; }'
                        + '#mxProcGrid.mx-form-study .mx-c9 .mx-chip .mx-pc-s{ font-size:calc(11.5 * var(--u)); font-weight:500; color:#64748B; line-height:1.4; letter-spacing:0; }'
                        /* тиха ремарка праворуч у широкій картці «Найчастіше» */
                        + '#mxProcGrid.mx-form-study .mx-favgrid .mx-pc .mx-pc-note{ margin-left:auto; padding-left:calc(12 * var(--u)); font-size:calc(11.5 * var(--u)); font-weight:500; color:#8A93A5; white-space:nowrap; }'
                        + '@media (max-width: 900px){ #mxProcGrid.mx-form-study .mx-favgrid .mx-pc .mx-pc-note{ display:none; } }';
                    (document.head || document.documentElement).appendChild(st);
                })();
                function optOf(m, re){
                    var f = null;
                    if(m){ m.opts.forEach(function(x){ if(!f && re.test(x.t)) f = x; }); }
                    return f;
                }
                // другий рядок усередині чипа: текстовий вузол → «назва + пояснення»
                function chipSub(x, text){
                    if(!x || !x.b || x.b.querySelector('.mx-pc-s')) return;
                    var b = x.b, tnode = null;
                    Array.prototype.slice.call(b.childNodes).forEach(function(n){
                        if(!tnode && n.nodeType === 3 && n.textContent.trim()) tnode = n;
                    });
                    var ttl = tnode ? tnode.textContent.trim() : (x.o ? x.o.textContent.trim() : '');
                    var tx = document.createElement('span'); tx.className = 'mx-pc-tx';
                    tx.innerHTML = '<span class="mx-pc-t">' + esc2(ttl) + '</span>'
                                 + '<span class="mx-pc-s">' + esc2(text) + '</span>';
                    if(tnode){ b.replaceChild(tx, tnode); }
                    else { b.insertBefore(tx, b.querySelector('.mx-chip-tick')); }
                    b.classList.add('mx-chip-desc');
                }
                chipSub(optOf(mJaw, /^кт двох щелеп$/), DESC_JAW);
                chipSub(optOf(mJaw, /щелеп з суглобами/), DESC_JAWJ);

                // ---- 4. «Опис знімків»: дві послуги, кожна доступна лише коли є що описувати.
                // Опис рентгенолога — не для 2D (панорама/ТРГ так не описуються);
                // цефалометричний аналіз — лише коли обрано ТРГ (бічну або пряму).
                var xOpis = null, xCeph = null;
                if(mExtra){
                    mExtra.opts.forEach(function(x){
                        if(!xOpis && /опис знімк/.test(x.t)){ xOpis = x; return; }
                        if(!xCeph && /цефалометр/.test(x.t)){ xCeph = x; return; }
                        // решту додаткових послуг у кабінеті не показуємо (рішення 2026-08-11)
                        x.cell.classList.add('mx-cell-off');
                        if(x.o.selected){ x.o.selected = false; x.b.classList.remove('mx-chip-on'); }
                    });
                    [xOpis, xCeph].forEach(function(x){
                        if(!x) return;
                        x.cell.classList.add('mx-cell-full');
                        mExtra.chips.appendChild(x.cell);
                    });
                    if(!xOpis && !xCeph && cExtra){ cExtra.classList.add('mx-field-off'); }
                }
                function is2D(t){ return /панорам|трг/.test(t); }
                function lockExtra(){
                    if(!mExtra) return;
                    var any3D = false, anyTRG = false;
                    mxStudy.multis.forEach(function(m){
                        if(m.off || m === mExtra) return;
                        m.opts.forEach(function(x){
                            if(!x.o.selected) return;
                            if(is2D(x.t)){ if(/трг/.test(x.t)) anyTRG = true; }
                            else { any3D = true; }
                        });
                    });
                    (mxStudy.segEls || []).forEach(function(sg){ if(sg.on()) any3D = true; });
                    var changed = false;
                    function setLock(x, ok){
                        if(!x) return;
                        x.cell.classList.toggle('mx-cell-lock', !ok);
                        if(!ok && x.o.selected){ x.o.selected = false; x.b.classList.remove('mx-chip-on'); changed = true; }
                    }
                    setLock(xOpis, any3D);
                    setLock(xCeph, anyTRG);
                    if(changed){
                        try{ mExtra.sel.dispatchEvent(new Event('change', { bubbles:true })); }catch(_){ }
                    }
                }

                // ---- 5. «Найчастіше» — великі картки, синхронні з чипами категорій (спільний <option>)
                var favRefs = [];
                (function(){
                    var byT = {};
                    mxStudy.allOpts().forEach(function(a){ if(!a.m.off && a.m !== mExtra && !byT[a.t]) byT[a.t] = a; });
                    function pick(){ for(var i = 0; i < arguments.length; i++){ if(byT[arguments[i]]) return byT[arguments[i]]; } return null; }
                    // макет George 2026-08-12: перший рядок — дві високі картки (щелепи / череп),
                    // кожна з поясненням; «з суглобами» — окремим широким рядком із тихою ремаркою
                    // праворуч; далі панорама і ТРГ
                    var FAV_LIST = [
                        { a: pick('кт двох щелеп'), tall: true, sub: DESC_JAW },
                        { a: pick('кт черепа + 3d ceph'), tall: true, sub: DESC_CEPH },
                        { a: pick('кт двох щелеп з суглобами'), full: true, note: NOTE_JAWJ },
                        { a: pick('панорамний знімок зубів') },
                        { a: pick('трг бічна проекція', 'трг бокова проекція') }
                    ];
                    var wrap = document.createElement('div'); wrap.className = 'mx-favgrid';
                    FAV_LIST.forEach(function(it){
                        var a = it.a; if(!a) return;
                        var pb = document.createElement('button'); pb.type = 'button';
                        pb.className = 'mx-pc' + (it.tall ? ' mx-pc-tall' : '') + (it.full ? ' mx-pc-full' : '');
                        var ttl = '<span class="mx-pc-t">' + esc2(a.x.o.textContent.trim()) + '</span>';
                        pb.innerHTML = mxStudy.ico(a.t)
                            + (it.sub ? '<span class="mx-pc-tx">' + ttl + '<span class="mx-pc-s">' + esc2(it.sub) + '</span></span>' : ttl)
                            + (it.note ? '<span class="mx-pc-note">' + esc2(it.note) + '</span>' : '')
                            + mxStudy.tick;
                        pb.addEventListener('click', function(){ a.x.b.click(); });
                        wrap.appendChild(pb);
                        favRefs.push({ a: a, pb: pb });
                    });
                    if(favRefs.length){ cFav.querySelector('.mx-c9-b').appendChild(wrap); }
                    else { cFav.classList.add('mx-field-off'); }
                })();
                function paintFav(){
                    favRefs.forEach(function(r){ r.pb.classList.toggle('mx-chip-on', r.a.x.o.selected); });
                }

                // ---- 6. коментар: плейсхолдер за ТЗ George
                if(elComment){
                    var cmf = elComment.querySelector('textarea, input[type="text"]');
                    if(cmf){ cmf.setAttribute('placeholder', 'Напишіть особливості виконання дослідження якщо є'); }
                }

                // ---- 7. поля поза картками: приховані — у САМИЙ кінець форми ПІСЛЯ карток
                // (значення для сабміту лишається, невидимі чипи не перехоплюють пошук по тексту);
                // нерозпізнане видиме поле — в окрему картку, а не голим у формі
                var leftovers = [];
                Array.prototype.slice.call(formEl.children).forEach(function(el){
                    if(!el.classList || !el.classList.contains('element')) return;
                    if(el.classList.contains('mx-field-off')){
                        if(sb && sb.parentNode === formEl){ formEl.insertBefore(el, sb); } else { formEl.appendChild(el); }
                    } else { leftovers.push(el); }
                });
                if(leftovers.length){ put(mkCard('Додатково', 'mx-c9-rest'), leftovers); }

                // ---- 8. інструкції під полем: плейсхолдер зникає рівно тоді, коли підказка потрібна
                Array.prototype.forEach.call(card.querySelectorAll('.element'), function(el){
                    if(el.querySelector('.mx-fhint')) return;
                    var d = el.querySelector('.description');
                    var dt = d ? d.textContent.replace(/\s+/g, ' ').trim() : '';
                    if(!dt || dt.indexOf('heading_filed:') === 0) return;
                    var f = el.querySelector('input[type="text"], input[type="tel"], input[type="email"], textarea');
                    var instr = /[—·]/.test(dt);
                    if(f && !instr) return;                       // опис уже працює плейсхолдером
                    if(f && instr){
                        var parts = dt.split('—');
                        var shortPh = parts[0].replace(/\s+/g, ' ').trim();
                        if(shortPh && parts.length > 1){
                            f.setAttribute('placeholder', shortPh);
                            dt = parts.slice(1).join('—').replace(/\s+/g, ' ').trim() || dt;   // у підказці — те, чого немає в плейсхолдері
                        }
                    }
                    var h = document.createElement('div'); h.className = 'mx-fhint'; h.textContent = dt;
                    el.appendChild(h);
                });

                // ---- 9. шапка: у цієї форми немає «кроку 2», не обіцяємо його
                var fillEl = lcol.querySelector('.mx-fill');
                if(fillEl) fillEl.style.display = 'none';
                var subEl2 = lcol.querySelector('.mx-fh-sub');
                if(subEl2){
                    subEl2.textContent = 'Зателефонуємо пацієнту протягом робочого дня і запишемо на зручний час.';
                    subEl2.setAttribute('data-mx-lock', '1');
                }

                // ---- 10. гейт: «оберіть дослідження» підсвічує картку «Найчастіше»
                if(cFav && !cFav.classList.contains('mx-field-off')){ mxStudy.firstStudyEl = cFav; }

    // імена пацієнтів у таблицях кабінету — з КАПСУ в людський регістр (лише показ)
    (function(){
        function norm(s){
            s = String(s == null ? '' : s).trim();
            if(!s || /[a-zа-яіїєґ]/.test(s)) return s;
            return s.toLowerCase().replace(/[^\s\-]+/g, function(w){
                if(w.length === 1) return w.toUpperCase();
                return w.charAt(0).toUpperCase() + w.slice(1);
            });
        }
        function sweep(){
            Array.prototype.forEach.call(document.querySelectorAll('td, .mx-cell-name'), function(td){
                if(td.children.length || td.__mxN) return;
                var t = (td.textContent || '').trim();
                if(t.length < 4 || t.length > 60) return;
                if(!/^[A-ZА-ЯІЇЄҐ][A-ZА-ЯІЇЄҐ\s'ʼ’.\-]+$/.test(t)) return;   // лише суцільний КАПС
                var n = norm(t);
                if(n !== t){ td.textContent = n; }
                td.__mxN = 1;
            });
        }
        sweep();
        var n = 0, t = setInterval(function(){ n++; sweep(); if(n > 12){ clearInterval(t); } }, 400);
        if(window.MutationObserver){
            var mo = new MutationObserver(function(){ sweep(); });
            mo.observe(document.body, { childList:true, subtree:true });
        }
    })();
    if(window.lucide) lucide.createIcons();
    var inpRef = null, btnRef = null;
    function placeBtn(){
        if(!inpRef || !btnRef) return;
        var cs = getComputedStyle(inpRef);
        var bT = parseFloat(cs.borderTopWidth) || 0;
        var bR = parseFloat(cs.borderRightWidth) || 0;
        var bB = parseFloat(cs.borderBottomWidth) || 0;
        var it = inpRef.offsetTop, il = inpRef.offsetLeft;
        var ih = inpRef.offsetHeight, iw = inpRef.offsetWidth;
        btnRef.style.top = (it + bT) + 'px';
        btnRef.style.height = (ih - bT - bB) + 'px';
        btnRef.style.left = (il + iw - bR - btnRef.offsetWidth) + 'px';
    }
    var tries = 0;
    function tune(){
        tries = tries + 1;
        if(tries > 40) return;
        var col = document.querySelector('.client-cell-body:not(.aside-left):not(.aside-right)');
        var inp = col ? col.querySelector('input[name="filtername"]') : null;
        if(!inp){ setTimeout(tune, 300); return; }
        var wrap = inp.parentElement;

        var btn = col.querySelector('.params-form input.os-button, .params-form input[type="submit"]');
        if(btn){
            btnRef = btn;
            if(!btn.classList.contains('mx-search-btn')){

                if(wrap && btn.parentElement !== wrap){ wrap.appendChild(btn); }
            }
        }
        if(wrap && !wrap.querySelector('.mx-search-ico')){
            var ico = document.createElement('i');
            ico.setAttribute('data-lucide','search');
            ico.className = 'mx-search-ico';
            wrap.appendChild(ico);
            if(window.lucide) lucide.createIcons();
        }
        placeBtn();
        if(!btn){ setTimeout(tune, 300); }
    }
    tune();
    window.addEventListener('resize', function(){ setTimeout(placeBtn, 60); });
    setTimeout(placeBtn, 700);
    setTimeout(placeBtn, 1500);
})();
</script>

<!-- ============================================================================
     MX-MFIX — сабміт мультисписків OneBox (форма 8 та будь-яка інша).

     ПРОБЛЕМА: власний Select2 OneBox називає поле name="select2_67[]".
     Браузер чесно кладе значення в POST, але приймач OneBox читає ключ
     select2_67 БЕЗ дужок і чекає рядок «А,Б». Масив із [] він мовчки
     ігнорує → у процесі поле порожнє.

     РІШЕННЯ: на submit у capture-фазі (раніше за будь-який обробник OneBox)
     дублюємо значення прихованим input із ключем без дужок і комою-роздільником.
     Старий select2_NN[] теж іде — сервер його ігнорує, конфлікту немає.

     КУДИ: окремим блоком у кінці hero.html — від решти коду не залежить.
     Перевірено на бою 2026-08-12: POST містить select2_67=«А,Б» → процес
     показує обидва значення (заявки 444295 / 444299).
============================================================================ -->
<script>
(function(){
  if (window.__mxMfix) return; window.__mxMfix = true;   // PJAX переінжектує hero.html — не дублюємо

  document.addEventListener('submit', function(e){
    var f = e.target;
    if (!f || f.tagName !== 'FORM') return;

    // прибрати дублі з попередньої (невдалої) спроби відправки
    Array.prototype.forEach.call(f.querySelectorAll('input.mx-mfix'), function(n){ n.remove(); });

    Array.prototype.forEach.call(f.querySelectorAll('select[multiple][name$="[]"]'), function(sel){
      var vals = Array.prototype.filter.call(sel.options, function(o){ return o.selected; })
                      .map(function(o){ return o.value; })
                      .filter(function(v){ return v !== ''; });
      if (!vals.length) return;                          // порожні списки не дублюємо

      var i = document.createElement('input');
      i.type      = 'hidden';
      i.className = 'mx-mfix';
      i.name      = sel.name.replace(/\[\]$/, '');       // select2_67[] → select2_67
      i.value     = vals.join(',');                      // «А,Б» — саме рядок, не кілька ключів
      f.appendChild(i);
    });
  }, true);                                              // true = capture, до обробників OneBox
})();
</script>

<!-- ============================================================================

<script>
(function(){
  if (window.__mxDone) return; window.__mxDone = true;

  var HERE_TXT = 'Ви тут';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

    if (document.getElementById('mxDoneCss')) return;
    var st = document.createElement('style'); st.id = 'mxDoneCss';

      /* повертаємо повідомлення, яке ховало правило «у картці форми лишається тільки form» */
      + '#mxProcGrid .mx-col-form .os-block-form > .nc-message-success,'

      + '#mxProcGrid .nc-message-success.mx-done::before{ display:none !important; }'
      + '.mx-done-ico{ width:calc(46 * var(--u)); height:calc(46 * var(--u)); border-radius:50%; background:#ECFDF5; color:#16A34A; display:flex; align-items:center; justify-content:center; margin:0 0 calc(15 * var(--u)); }'
      + '.mx-done-ico svg{ width:calc(23 * var(--u)); height:calc(23 * var(--u)); }'
      + '.mx-done-s{ font-size:calc(15 * var(--u)); font-weight:600; line-height:1.55; color:#0F172A; letter-spacing:-0.01em; margin:0 0 calc(20 * var(--u)); max-width:calc(520 * var(--u)); }'
      + '.mx-done-cta{ display:inline-flex; align-items:center; gap:calc(8 * var(--u)); height:calc(44 * var(--u)); padding:0 calc(20 * var(--u)); box-sizing:border-box; background:#0F172A; color:#FFFFFF !important; text-decoration:none !important; font-size:calc(14.5 * var(--u)); font-weight:600; border-radius:calc(11 * var(--u)); transition:background .15s ease; }'
      + '.mx-done-cta:hover{ background:#1E293B; }';
    (document.head || document.documentElement).appendChild(st);
  })();

  function esc(x){ return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function apply(){
    var grid = document.getElementById('mxProcGrid');
    if (!grid) return false;
    var msg = grid.querySelector('.mx-col-form .os-block-form > .nc-message-success');
    if (!msg) return false;                       // це не екран подяки
    if (msg.classList.contains('mx-done')) return true;

    // 2) шапка: кроку більше немає, заголовок говорить про результат

      var here0 = s0.querySelector('.mx-stp-here'); if (here0 && here0.parentNode) here0.parentNode.removeChild(here0);
      s1.classList.add('mx-stp-act');
      if (!s1.querySelector('.mx-stp-here')){
        var tx = s1.querySelector('.mx-stp-txt');
        if (tx) tx.insertAdjacentHTML('afterbegin', '<div class="mx-stp-here">' + HERE_TXT + '</div>');
      }
    }
    return true;
  }

  // сітку будує основний код hero.html — чекаємо її появи (і після партіал-навігації теж)
  function watch(){
    var tries = 0;
    var t = setInterval(function(){
      tries++;
      if (apply() || tries > 40) clearInterval(t);   // ~6 с
    }, 150);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch);
  else watch();
  window.addEventListener('mx:navigated', watch);
})();
</script>

  // значення поля: непідставлений плейсхолдер OneBox → порожньо
  function val(node){
    if(!node) return '';

    if(!t) return '';
    if(t.indexOf('{|') !== -1 || t.indexOf('{$') !== -1 || /^\[[a-z_]+\]$/i.test(t)) return '';
    return t.replace(/[\s,;·]+$/, '');          // поля OneBox часто закінчуються комою
  }
  // блок даних дублює кожне поле кількома синтаксисами — беремо перший, що підставився
  function pick(parent, k){

    for(var i = 0; i < list.length; i++){ var v = val(list[i]); if(v) return v; }

  function ico(t){

  // ── дані з «Універсального блока» OneBox ──────────────────────────────────
  function blockData(){
    var d = { patient:'', date:'', done:'', status:'', statusid:'', phone:'', branch:'', zone:'', items:[] };
    var by = {};
    function item(n){ if(!by[n]) by[n] = { n:+n, name:'', url:'', cmt:'', spec:'' }; return by[n]; }

    Array.prototype.forEach.call(document.querySelectorAll('.js-data-element'), function(el){
      var cap = el.querySelector('.flex-caption'), v = el.querySelector('.flex-value');
      if(!cap || !v) return;
      var c = norm(cap.textContent).replace(/[:?]/g, ' ').replace(/\s+/g, ' ').trim();
      var txt = (v.textContent || '').replace(/\s+/g, ' ').trim().replace(/[\s,;·]+$/, '');
      var a = v.querySelector('a[href]');
      var url = a ? a.getAttribute('href') : '';
      var m;
      if(!c || (!txt && !url)) return;
      if(/^статус/.test(c)){ if(!d.status) d.status = txt; return; }
      if(/тип виконаного|тип знімка|виконано дослідження/.test(c)){ if(!d.done) d.done = txt; return; }
      if(/дата виконання|дата дослідження/.test(c)){ if(!d.date) d.date = txt; return; }
      if(/телефон/.test(c)){ if(!d.phone) d.phone = txt; return; }
      if(/філія|филиал|відділення/.test(c)){ if(!d.branch) d.branch = txt; return; }
      if(/зона інтересу|зона интереса/.test(c)){ if(!d.zone) d.zone = txt; return; }
      if(/(пацієнт|пациент|піб)/.test(c) && !/телефон|email|поштa|пошта/.test(c)){ if(!d.patient) d.patient = txt; return; }
      if((m = c.match(/послуга\s*(\d)/)) && !/коментар/.test(c)){ item(m[1]).name = txt; return; }
      if((m = c.match(/результат\s+досліджен\S*\s*№?\s*(\d)/))){ var it = item(m[1]); it.url = url || (/^https?:/i.test(txt) ? txt : ''); return; }
      if((m = c.match(/коментар\s+послуга\s*(\d)/))){ item(m[1]).cmt = txt; return; }
      if((m = c.match(/особливост\S*\s+досліджен\S*\s*(\d)/))){ item(m[1]).spec = txt; return; }
    });

    Object.keys(by).sort().forEach(function(k){ var it = by[k]; if(it.url || it.name){ it.no = d.items.length + 1; d.items.push(it); } });
    // номер процесу беремо з URL — не залежимо від жодної змінної OneBox
    var mo = location.pathname.match(/\/client\/order\/(\d+)/);
    d.num = mo ? mo[1] : '';
    return d;
  }

  // блок 5 може колись почати підставляти змінні — тоді його значення мають перевагу
  function read(src){
    var d = blockData();
    if(src){
      ['patient','date','done','statusid','phone','branch','zone'].forEach(function(k){ var v = pick(src, k); if(v) d[k] = v; });
      var over = [];
      Array.prototype.forEach.call(src.querySelectorAll('[data-k="item"]'), function(it){
        var o = { name: pick(it,'name'), url: pick(it,'url'), cmt: pick(it,'cmt'), spec: pick(it,'spec'), no: over.length + 1 };
        if(o.url || o.name) over.push(o);
      });
      if(over.length) d.items = over;
    }
    // «Виконано» — якщо окремого поля немає, збираємо з назв послуг
    if(!d.done && d.items.length){
      d.done = d.items.map(function(it){ return it.name; }).filter(Boolean).join(', ');
    }
    // СТАРІ ПРОЦЕСИ: є лише посилання «Файл №1..5», назв послуг немає.
    // Тоді беремо назви з поля «Назва дослідження» — якщо їх рівно стільки ж,
    // скільки файлів, розкладаємо по порядку; інакше нумеруємо чесно.
    var noNames = d.items.length && d.items.every(function(it){ return !it.name; });
    if(noNames){
      var names = String(d.done || '').split(/[,;]/).map(function(x){ return x.trim(); }).filter(Boolean);
      d.items.forEach(function(it, i){
        it.name = (names.length === d.items.length) ? names[i] : '';
        it.legacy = true;
      });
    }
    return d;
  }

  function stageOf(d){

    if(/виконан/.test(t)) return 1;
    return 3;
  }

  function plural(n, a, b, c){
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return a;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b;
    return c;
  }
  function cut(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n - 1).replace(/[\s,;.]+$/, '') + '…' : s; }

  // ── шапка пацієнта: ідентифікація + факти + контроль якості одним обʼєктом ──
  function initials(name){
    var w = String(name || '').trim().split(/\s+/).filter(Boolean);
    if(!w.length) return '—';
    return (w[0].charAt(0) + (w[1] ? w[1].charAt(0) : '')).toUpperCase();
  }
  // Верхній ряд повторює сітку низу: ліворуч — картка пацієнта (ширина карток),
  // праворуч — картка гарантії (ширина панелі). Жодна лінія не обривається.
  function monthsSince(iso){
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return null;
    var now = new Date();
    return (now.getFullYear() - (+m[1])) * 12 + (now.getMonth() + 1 - (+m[2]));
  }
  function plusMonths(iso, m){
    var d0 = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!d0) return '';
    var y = +d0[1], mo = +d0[2] + m, day = d0[3];
    y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12) + 1;
    return day + '.' + (mo < 10 ? '0' + mo : mo) + '.' + y;
  }
  function head(d, files, stage){
    var city = String(d.branch || '').replace(/\s*№\s*\d+\s*$/, '').trim() || 'Дніпро';
    function kv(k, v){ return '<span class="mxr-v-k">' + k + '</span><span class="mxr-v-v">' + v + '</span>'; }

    var visit = '';
    if(d.date) visit += kv('Дата', esc(dateUA(d.date)));
    visit += kv('Місто', esc(city));

    var order = kv('Статус', 'Виконано');
    if(d.num) order += kv('Номер', esc(d.num));

    return '<div class="mxr-head">'
      + '<div class="mxr-col">'
        + '<div class="mxr-lbl">Пацієнт</div>'
        + '<div class="mxr-box mxr-p">'
          + '<div class="mxr-p-tx">'
            + '<div class="mxr-p-name">' + esc(d.patient || 'Рентгенологічне дослідження') + '</div>'
            + (d.birth ? '<div class="mxr-p-sub">Дата народження · <b>' + esc(dateUA(d.birth)) + '</b></div>' : '')
          + '</div>'
          + '<div class="mxr-v mxr-v-in">' + visit + '</div>'
        + '</div>'
      + '</div>'
      + '<div class="mxr-col mxr-col-v">'
        + '<div class="mxr-lbl">Замовлення</div>'
        + '<div class="mxr-box"><div class="mxr-v">' + order + '</div></div>'
      + '</div>'
      + '</div>';
  }

  function offerData(d, files){
    var all = norm(files.map(function(it){ return it.name; }).join(' ') + ' ' + (d.done || ''));
    var hasCT   = /\bкт\b|кт |сегмент|суглоб|череп|пазух|конусно/.test(all);
    var hasPano = /панорам|ортопантом/.test(all);
    var hasTRG  = /трг|ceph|цефалометр/.test(all);

    var GUID_CT   = { t:'Хірургічний шаблон', h:FORM_GUID, p:PRICE_GUID,
                      s:'Сплануємо та виготовимо шаблон протягом 48 годин після погодження.',
                      short:'планування імплантації за цим знімком' };
    var GUID_PANO = { t:'Хірургічний шаблон', h:FORM_GUID, p:PRICE_GUID,
                      s:'Плануєте імплантацію? Зробимо КТ і виготовимо шаблон за ним.',
                      short:'КТ і шаблон для імплантації' };
    var CEPH      = { t:'Цефалометричний аналіз', h:CEPH_URL, p:PRICE_CEPH,
                      s:'Розрахунки за 10+ авторами на основі цього ТРГ.',
                      short:'розрахунки за 10+ авторами' };
    var OPYS      = { t:'Опис знімка', h:FORM_OPYS, p:PRICE_OPYS,
                      s:'Лікар-рентгенолог опише виконане дослідження письмово — до трьох робочих днів.',
                      short:'письмовий висновок рентгенолога' };

    var main = null, rest = [];
    if(hasCT || hasPano){
      main = hasCT ? GUID_CT : GUID_PANO;
      if(hasCT) rest.push(OPYS);
      if(hasTRG) rest.push(CEPH);
    } else if(hasTRG){
      main = CEPH;
    }
    return { main: main, rest: rest };
  }

  function altRows(rest){
    return rest.map(function(o){
      return '<a class="mxr-alt" href="' + o.h + '">'
        + '<span class="mxr-alt-tx"><span class="mxr-alt-t">Також ' + o.t.toLowerCase() + '</span>'
        + '<span class="mxr-alt-s">' + o.short + (o.p ? ' · ' + esc(o.p) : '') + '</span></span>'
        + '<span class="mxr-alt-go">' + ARR + '</span></a>';
    }).join('');
  }
  function cta(o, flat){
    var t = (o.p ? 'Замовити — ' + esc(o.p) : 'Замовити');
    return '<span class="' + (flat ? 'mxr-o-link' : 'mxr-o-b') + '">' + t + ARR + '</span>';
  }
  function guarantees(d){
    return '<div class="mxr-ft">' + CHECK + 'Дані пацієнта захищені</div>'
      + '<a class="mxr-help" href="' + MX_TG + '?text=' + encodeURIComponent('Питання щодо дослідження' + (d.num ? ' №' + d.num : '')) + '" target="_blank" rel="noopener">Питання щодо знімка? Напишіть нам</a>';
  }

  // вузька колонка — коли карток багато і висоти зіставні
  function sidePanel(d, o){
    if(!o.main) return '';
    return '<div class="mxr-side">'
      + '<div class="mxr-eyebrow">Що ще можемо</div>'
      + '<a class="mxr-o-zone" href="' + o.main.h + '">'
        + '<span class="mxr-o-t">' + o.main.t + '</span>'
        + '<span class="mxr-o-s">' + o.main.s + '</span>'
        + cta(o.main)
      + '</a>'
      + (o.rest.length ? '<div class="mxr-o-alt">' + altRows(o.rest) + '</div>' : '')
      + '<div class="mxr-foot">' + guarantees(d) + '</div>'
      + '</div>';
  }

  // широка смуга під результатами — коли досліджень одне-два і колонка була б
  // коротшою за панель. Порожнеча зникає не розтягуванням, а зміною композиції
  function bandPanel(d, o){
    if(!o.main) return '';
    var split = o.rest.length > 0;                    // є вторинні пропозиції → дві зони
    return '<div class="mxr-band">'
      + '<div class="mxr-band-body' + (split ? ' mxr-band-split' : '') + '">'
        + '<a class="mxr-band-top" href="' + o.main.h + '">'
          + '<span class="mxr-eyebrow">Що ще можемо</span>'
          + '<span class="mxr-o-t">' + o.main.t + '</span>'
          + '<span class="mxr-o-s">' + o.main.s + '</span>'
          + cta(o.main, true)
        + '</a>'
        + (split ? '<div class="mxr-band-side">' + altRows(o.rest) + '</div>' : '')
      + '</div>'
      + '<div class="mxr-band-foot">' + guarantees(d) + '</div>'
      + '</div>';
  }

  function build(d){
    var stage = stageOf(d);
    var files = d.items.filter(function(it){ return !!it.url; });
    files.forEach(function(it, i){ it.no = i + 1; });
    var legacy = d.items.some(function(it){ return it.legacy; });

    function details(it){
      var h = '';
      if(it.spec) h += '<div class="mxr-spec"><span class="mxr-spec-k">Особливість виконання</span>' + esc(it.spec) + '</div>';
      if(it.cmt)  h += '<div class="mxr-note"><span class="mxr-note-h">Примітка до цього знімка</span>'
                     + '<span class="mxr-note-t">' + esc(it.cmt) + '</span></div>';
      return h;
    }
    function title(it){ return esc(it.name || 'Дослідження ' + it.no); }

    // Усі дослідження візиту рівнозначні: лікар не ділить їх на головне і
    // другорядне, тож і картки однакові. Велика картка лишається тільки тоді,
    // коли дослідження справді одне — тоді це не ієрархія, а просто масштаб.
    function card(it, solo){
      var plain = !it.spec && !it.cmt;          // нема деталей — усе центруємо по вертикалі
      return '<div class="mxr-card' + (solo ? ' mxr-solo' : '') + (plain ? ' mxr-plain' : '') + '">'
        + ico(it.name).replace('mxr-ico', 'mxr-card-ic')
        + '<div class="mxr-card-tx"><div class="mxr-card-t">' + title(it) + '</div>' + details(it) + '</div>'
        + '<a class="mxr-dl" href="' + esc(it.url) + '" target="_blank" rel="noopener" data-mx-dl="1">' + DL + 'Завантажити</a>'
        + '</div>';
    }

    // дослідження є, а посилання немає. Це або файл ще не залили (свіжий візит),
    // або строк зберігання минув. Розрізняємо ЛИШЕ за датою візиту — щоб не
    // видати за «видалений файл» просто незаповнене поле
    var gone = d.items.filter(function(it){ return !it.url && it.name; });
    var months = monthsSince(d.date);
    var expired = (months !== null && months >= KEEP_M);

    var secH = files.length ? '<div class="mxr-sec-h">' + (files.length === 1 ? 'Результат' : 'Результати') + '<span class="mxr-qc">' + CHECK + 'якість перевірено</span></div>' : '';
    var main = '';
    if(files.length === 1){
      main = card(files[0], true);
    } else if(files.length){
      main = files.map(function(it){ return card(it, false); }).join('');
    } else if(!gone.length){
      main = '<div class="mxr-empty">Файли ще готуються — щойно результат буде завантажено, він зʼявиться тут.</div>';
    }

    if(gone.length){
      var names = gone.map(function(it){ return esc(it.name); }).join(', ');
      main += expired
        ? '<div class="mxr-gone">'
            + '<div class="mxr-gone-t">Файли цього дослідження вже не зберігаються</div>'
            + '<div class="mxr-gone-s">Минуло понад ' + KEEP_M + ' ' + plural(KEEP_M, 'місяць', 'місяці', 'місяців')
              + ' з дати візиту, тому ' + (gone.length > 1 ? 'файли' : 'файл') + ' знято зі зберігання'
              + (names ? ' (' + names + ')' : '') + '. Якщо потрібен — напишіть нам, ми завантажимо повторно.</div>'
            + '<a class="mxr-gone-b" href="' + MX_TG_FILE + '?text=' + encodeURIComponent('Потрібен файл дослідження' + (d.num ? ' №' + d.num : '')) + '" target="_blank" rel="noopener">' + TG + 'Написати в Telegram</a>'
          + '</div>'
        : '<div class="mxr-empty">' + (gone.length > 1 ? 'Файли ще готуються' : 'Файл ще готується')
            + (names ? ' — ' + names : '') + '. Щойно результат буде завантажено, він зʼявиться тут.</div>';
    }


    var od = offerData(d, files);
    var wide = files.length <= 2;                     // одне-два дослідження → смуга, а не колонка

    return '<div id="mxResView"' + (wide ? ' class="mxr-wide"' : '') + '>'
      + '<div class="mxr-top">'
        + '<a class="mxr-back" href="' + BACK_URL + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Мої пацієнти</a>'
        + '<span class="mxr-safe">' + SHIELD + 'Дані захищені</span>'
      + '</div>'
      + head(d, files, stage)
      + secH
      + (wide
          ? '<div class="mxr-grid mxr-grid-wide"><div class="mxr-main">' + main + '</div></div>' + bandPanel(d, od)
          : '<div class="mxr-grid"><div class="mxr-main">' + main + '</div>'
            + '<div class="mxr-side-col">' + sidePanel(d, od) + '</div></div>')
      + '</div>';
  }

  // стан «уже забрав»: інструмент має памʼятати за лікаря в межах сеансу
  function markDownloads(root){
    Array.prototype.forEach.call(root.querySelectorAll('[data-mx-dl]'), function(a){
      a.addEventListener('click', function(){
        if(a.classList.contains('mxr-got')) return;
        a.classList.add('mxr-got');
        var txt = a.lastChild;
        if(txt && txt.nodeType === 3) txt.textContent = 'Завантажено';
      });
    });
  }

  // на вузькому екрані пропозиція має стояти одразу після головного результату,
  // а не після всього контенту
  function mobileOrder(root){
    var mq = window.matchMedia('(max-width: 900px)');
    var grid = root.querySelector('.mxr-grid');
    var side = root.querySelector('.mxr-side-col');
    var main = root.querySelector('.mxr-main');
    if(!grid || !side || !main) return;
    function place(){
      if(mq.matches){
        var hero = main.querySelector('.mxr-card');
        if(hero && side.parentNode !== main){ hero.parentNode.insertBefore(side, hero.nextSibling); }
      } else if(side.parentNode !== grid){
        grid.appendChild(side);
      }
    }
    place();
    if(mq.addEventListener) mq.addEventListener('change', place);
    else if(mq.addListener) mq.addListener(place);
  }

  function apply(){
    var src = document.getElementById('mxResData');
    if (!src) return false;
    if (document.getElementById('mxResView')) return true;

    var d = read(src);
    css();

    (function(){
      var n = 0;
      var h = setInterval(function(){
        n++;
        ['mxProcTop', 'mxProcGrid'].forEach(function(id){
          var e = document.getElementById(id); if (e) e.style.setProperty('display', 'none', 'important');
        });
        Array.prototype.forEach.call(
          document.querySelectorAll('.client-cell-body:not(.aside-left):not(.aside-right) .os-block-element, .client-cell-body:not(.aside-left):not(.aside-right) .os-block-form'),
          function(e){ if (!e.closest('#mxResView')) e.style.setProperty('display', 'none', 'important'); }
        );
        if (n > 60) clearInterval(h);
      }, 150);
    })();

    var host = document.querySelector('.client-cell-body:not(.aside-left):not(.aside-right)') || src.parentNode;
    var wrap = document.createElement('div');
    wrap.innerHTML = build(d);
    var view = wrap.firstChild;
    host.insertBefore(view, host.firstChild);
    markDownloads(view);
    mobileOrder(view);
    return true;
  }

  function watch(){
    var tries = 0;
    var t = setInterval(function(){
      tries++;
      if (apply() || tries > 60) clearInterval(t);
    }, 150);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch);
  else watch();
  window.addEventListener('mx:navigated', watch);
})();
</script>
